  <text x="480" y="526" fill="#613f3a" font-family="Georgia,serif" font-size="24" font-style="italic" text-anchor="middle">Para: Lady Ansandri</text>
  <text x="480" y="554" fill="#967a5c" font-family="Georgia,serif" font-size="15" letter-spacing="4" text-anchor="middle">✦  UNA INVITACIÓN DEL CORAZÓN  ✦</text>
