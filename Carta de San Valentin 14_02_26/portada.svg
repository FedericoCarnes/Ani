<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">Una carta de San Valentín</title>
  <desc id="description">Un sobre sellado con un corazón dorado sobre papel color marfil.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fbf4e8"/>
      <stop offset="1" stop-color="#e8d5be"/>
    </linearGradient>
    <linearGradient id="envelope" x2="0" y2="1">
      <stop stop-color="#a66361"/>
      <stop offset="1" stop-color="#713c40"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop stop-color="#f6df9c"/>
      <stop offset="1" stop-color="#bc8c43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#4f2c2a" flood-opacity=".23"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#paper)"/>
  <rect x="22" y="22" width="916" height="556" rx="4" fill="none" stroke="#ad8b59" stroke-width="2"/>
  <rect x="34" y="34" width="892" height="532" rx="3" fill="none" stroke="#ad8b59" stroke-opacity=".42"/>
  <path d="M66 70h52m-26-26v52M842 70h52m-26-26v52M66 530h52m-26-26v52M842 530h52m-26-26v52" fill="none" stroke="#ad8b59" stroke-width="2" opacity=".7"/>
  <text x="480" y="113" fill="#613f3a" font-family="Georgia,serif" font-size="38" letter-spacing="9" text-anchor="middle">SOCIETY PAPER</text>
  <path d="M282 143h396" stroke="#ad8b59" stroke-width="2"/>
  <text x="480" y="181" fill="#846a58" font-family="Georgia,serif" font-size="20" letter-spacing="5" text-anchor="middle">LONDRES · 14 DE FEBRERO</text>
  <g filter="url(#shadow)">
    <rect x="268" y="238" width="424" height="239" rx="9" fill="#d7c6ba"/>
    <path d="M268 257l212 151 212-151v200a20 20 0 0 1-20 20H288a20 20 0 0 1-20-20z" fill="url(#envelope)"/>
    <path d="M268 258l212 155 212-155" fill="none" stroke="#f1dfca" stroke-opacity=".62" stroke-width="3"/>
    <circle cx="480" cy="379" r="44" fill="#651f2b" stroke="url(#gold)" stroke-width="5"/>
    <path d="M480 398s-27-16-27-34c0-15 19-20 27-6 8-14 27-9 27 6 0 18-27 34-27 34z" fill="url(#gold)"/>
